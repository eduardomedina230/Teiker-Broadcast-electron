appId: mx.teiker.broadcast
productName: Teiker Broadcast
copyright: Copyright © 2026 Teiker

directories:
  output: dist
  buildResources: assets

files:
  - "src/**/*"
  - "assets/**/*"
  - "package.json"
  - "!**/*.map"

extraResources:
  - from: .env
    to: .env
    filter:
      - "**/*"

publish:
  provider: github
  owner: eduardomedina230
  repo: Teiker-Broadcast-electron

mac:
  category: public.app-category.utilities
  extendInfo:
    LSUIElement: true
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: pkg
      arch:
        - arm64
        - x64
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  runAfterFinish: true
  installerSidebar: null
