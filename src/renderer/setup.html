<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Teiker Broadcast — Setup</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .setup { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      .setup-brand { display: flex; align-items: center; gap: 12px; }
      .setup-brand .brand-mark { width: 40px; height: 40px; font-size: 22px; border-radius: 10px; }
    </style>
  </head>
  <body>
    <div class="setup">
      <div class="setup-brand">
        <span class="brand-mark" aria-hidden="true">T</span>
        <div>
          <h1>Teiker Broadcast</h1>
          <p>Primera vez en esta máquina. ¿Quién eres?</p>
        </div>
      </div>
      <input id="name" type="text" placeholder="Tu nombre" autofocus />
      <input id="backend" type="url" placeholder="URL del servidor (opcional)" />
      <p class="setup-hint">Ej. https://teiker-broadcast-web.vercel.app — déjalo vacío si ya está configurado.</p>
      <div class="row">
        <button class="primary" id="submit">Continuar</button>
      </div>
      <p class="error" id="error" style="display:none"></p>
    </div>
    <script>
      const $name = document.getElementById('name')
      const $backend = document.getElementById('backend')
      const $submit = document.getElementById('submit')
      const $error = document.getElementById('error')

      async function submit() {
        const name = $name.value.trim()
        if (!name) return
        $submit.disabled = true
        $error.style.display = 'none'
        try {
          const backendUrl = $backend.value.trim() || undefined
          await window.api.registerUser(name, backendUrl)
        } catch (err) {
          $error.textContent = err?.message || 'Error registrando'
          $error.style.display = 'block'
          $submit.disabled = false
        }
      }

      $submit.addEventListener('click', submit)
      $name.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit() })
    </script>
  </body>
</html>
